function resizeCanvas(){

player.y=dom.gameCanvas.height-player.size-40;

function spawnEnemy(){

x:Math.random()*(dom.gameCanvas.width-60),
y:-60,
size:60,

});
}

const touch=e.touches[0];
player.isMoving=true;
player.touchX=touch.clientX-player.x;
});
dom.gameCanvas.addEventListener('touchmove',(e)=>{
e.preventDefault();
if(!player.isMoving||!config.isPlaying)return;
const touch=e.touches[0];
player.x=touch.clientX-player.touchX;
player.x=Math.max(0,Math.min(dom.gameCanvas.width-player.size,player.x));

? player.baseAttackSpeed / config.shopItems[1].attackSpeedMultiplier 
: player.baseAttackSpeed;

x:player.x+player.size/2-8,
y:player.y,
width:16,
height:30,

function drawPlayer(){
dom.gameCtx.fillStyle='#ffd700';
dom.gameCtx.fillRect(player.x,player.y,player.size,player.size);
dom.gameCtx.fillStyle='#ff0000';
dom.gameCtx.fillRect(player.x,player.y-10,player.size,8);
dom.gameCtx.fillStyle='#00ff00';
dom.gameCtx.fillRect(player.x,player.y-10,player.size*(player.hp/100),8);
if(config.itemEffects.armorActive){
dom.gameCtx.strokeStyle='#00ffff';
dom.gameCtx.lineWidth=5;
dom.gameCtx.setLineDash([5,5]);
dom.gameCtx.strokeRect(player.x-5,player.y-5,player.size+10,player.size+10);
dom.gameCtx.setLineDash([]);
dom.gameCtx.fillStyle='#00ffff';
dom.gameCtx.font='bold 18px CustomFont';
dom.gameCtx.fillText(`耐久:${config.itemEffects.armorDurability}%`,player.x,player.y+player.size+25);
}
if(config.itemEffects.speedBoostActive){
dom.gameCtx.fillStyle='#ff6600';
dom.gameCtx.font='bold 18px CustomFont';
dom.gameCtx.fillText('射速提升!',player.x,player.y+player.size+25);
}
}
function updateAttacks(){
for(let i=attacks.length-1;i>=0;i--){
const a=attacks[i];
a.y-=15;
dom.gameCtx.fillStyle='#ff3300';
dom.gameCtx.fillRect(a.x,a.y,a.width,a.height);
if(a.y<0)attacks.splice(i,1);
}
}
function updateEnemies(){
for(let i=enemies.length-1;i>=0;i--){
const enemy=enemies[i];
enemy.y+=enemy.speed;
dom.gameCtx.fillStyle='#6699ff';
dom.gameCtx.fillRect(enemy.x,enemy.y,enemy.size,enemy.size);
if(config.itemEffects.armorActive){
const distance=Math.sqrt(
Math.pow(enemy.x+enemy.size/2-(player.x+player.size/2),2) +
Math.pow(enemy.y+enemy.size/2-(player.y+player.size/2),2)
);
if(distance<player.size+enemy.size/2){
enemies.splice(i,1);
config.sound.defeat.currentTime=0;
config.sound.defeat.play().catch(()=>{});
config.itemEffects.armorDurability-=2;
if(config.itemEffects.armorDurability<=0){
config.itemEffects.armorActive=false;
}
setTimeout(()=>{
handleEnemyDeath();
},100);
continue;
}
}
for(let j=attacks.length-1;j>=0;j--){
const a=attacks[j];
if(a.x<enemy.x+enemy.size&&a.x+a.width>enemy.x&&a.y<enemy.y+enemy.size&&a.y+a.height>enemy.y){
enemy.hp-=a.damage;
attacks.splice(j,1);
if(enemy.hp<=0){
enemies.splice(i,1);
config.sound.defeat.currentTime=0;
config.sound.defeat.play().catch(()=>{});
setTimeout(()=>{
handleEnemyDeath();
},100);
}
}
}
if(!config.itemEffects.armorActive){
if(player.x<enemy.x+enemy.size&&player.x+player.size>enemy.x&&player.y<enemy.y+enemy.size&&player.y+player.size>enemy.y){
player.hp=Math.max(0,player.hp-5);
enemies.splice(i,1);
if(player.hp<=0)player.hp=100;
}
}
if(enemy.y>dom.gameCanvas.height)enemies.splice(i,1);
}
}
function handleEnemyDeath(){
config.searchCount++;
dom.searchCountSpan.textContent=config.searchCount;
saveDataAsync('goldSearchCount',config.searchCount);

function openSearchModal(){

dom.searchResult.textContent='正在搜索宝物...';

slot.innerHTML='';
slot.classList.remove('slot-active');
});
const randomVal=Math.random()*100;
let selectedItem=null;
if(randomVal<config.items[1].probability){
selectedItem=config.items[1];
}else if(randomVal<config.items[0].probability+config.items[1].probability){
selectedItem=config.items[0];
}else{
selectedItem=config.items[2];
}
let rotateAngle=0;
function rotateMagnifier(){
if(dom.searchModal.style.display!=='flex')return;
rotateAngle+=15;
dom.magnifier.style.transform=`rotate(${rotateAngle}deg)`;
if(rotateAngle<selectedItem.rotateTime/40*15)requestAnimationFrame(rotateMagnifier);
}
rotateMagnifier();

if(selectedItem.quality==='gold'||selectedItem.quality==='red'){
config.sound.gameBgm.pause();
config.sound.rare.currentTime=0;
config.sound.rare.play().catch(()=>{});
config.sound.rare.onended=()=>{
if(config.isPlaying)config.sound.gameBgm.play().catch(()=>{});
};
}
dom.slots.forEach((slot,index)=>{
if(index<selectedItem.slots){
setTimeout(()=>{
slot.style.backgroundColor=selectedItem.color;
slot.classList.add('slot-active');
slot.innerHTML=`<img src="${selectedItem.icon}"class="item-icon">`;
},index*350);
}
});
setTimeout(()=>{
dom.searchResult.textContent=`获得${selectedItem.name}！`;
config.warehouse[selectedItem.name]=Number(config.warehouse[selectedItem.name])+1;
saveDataAsync('goldWarehouse',config.warehouse);
updateWarehouse();
updateItemBarCounts();
},selectedItem.slots*350+600);
},selectedItem.rotateTime);
}

// ========== PC 键盘鼠标操作优化 ==========
const pcKeys = { left: false, right: false, shoot: false };
let pcShootTimer = null;

// 键盘按下
document.addEventListener('keydown', function(e) {
    if (!config.isPlaying) return;
    var key = e.key.toLowerCase();
    
    if (key === 'a' || key === 'arrowleft') {
        pcKeys.left = true;
    }
    if (key === 'd' || key === 'arrowright') {
        pcKeys.right = true;
    }
    if (key === ' ' || key === 'j') {
        if (!pcKeys.shoot) {
            pcKeys.shoot = true;
            startPcShoot();
        }
        e.preventDefault();
    }
    if (key === '1') {
        usePcItem(0);
    }
    if (key === '2') {
        usePcItem(1);
    }
    if (key === 'e') {
        dom.interactBtn.click();
    }
    if (key === 'escape') {
        dom.exitBtn.click();
    }
});

// 键盘松开
document.addEventListener('keyup', function(e) {
    var key = e.key.toLowerCase();
    
    if (key === 'a' || key === 'arrowleft') {
        pcKeys.left = false;
    }
    if (key === 'd' || key === 'arrowright') {
        pcKeys.right = false;
    }
    if (key === ' ' || key === 'j') {
        pcKeys.shoot = false;
        stopPcShoot();
    }
});

// 鼠标点击射击
dom.gameCanvas.addEventListener('mousedown', function(e) {
    if (!config.isPlaying) return;
    if (e.button === 0) {
        pcKeys.shoot = true;
        startPcShoot();
    }
});

dom.gameCanvas.addEventListener('mouseup', function(e) {
    if (e.button === 0) {
        pcKeys.shoot = false;
        stopPcShoot();
    }
});

// 鼠标移动控制
dom.gameCanvas.addEventListener('mousemove', function(e) {
    if (!config.isPlaying) return;
    var rect = dom.gameCanvas.getBoundingClientRect();
    var mouseX = e.clientX - rect.left;
    player.x = mouseX - player.size / 2;
    player.x = Math.max(0, Math.min(dom.gameCanvas.width - player.size, player.x));
});

// 开始射击
function startPcShoot() {
    if (pcShootTimer) return;
    var speed = config.itemEffects.speedBoostActive 
        ? player.baseAttackSpeed / config.shopItems[1].attackSpeedMultiplier 
        : player.baseAttackSpeed;
    
    doShoot();
    pcShootTimer = setInterval(function() {
        if (pcKeys.shoot && config.isPlaying) {
            doShoot();
        }
    }, speed);
}

// 停止射击
function stopPcShoot() {
    if (pcShootTimer) {
        clearInterval(pcShootTimer);
        pcShootTimer = null;
    }
}

// 发射子弹
function doShoot() {
    var dmg = config.itemEffects.speedBoostActive 
        ? player.baseAttackDamage * config.shopItems[1].attackDamageMultiplier 
        : player.baseAttackDamage;
    
    attacks.push({
        x: player.x + player.size / 2 - 8,
        y: player.y,
        width: 16,
        height: 30,
        damage: dmg
    });
    config.sound.click.currentTime = 0;
    config.sound.click.play().catch(function(){});
}

// 使用物品
function usePcItem(idx) {
    var slots = dom.itemBar.querySelectorAll('.item-slot-bar');
    if (slots[idx]) {
        slots[idx].click();
        setTimeout(function() {
            dom.interactBtn.click();
        }, 50);
    }
}

// 重写游戏循环，加入键盘移动
var origGameLoop = gameLoop;
gameLoop = function() {
    if (!config.isPlaying) return;
    
    // 键盘移动
    if (pcKeys.left) {
        player.x -= player.speed;
    }
    if (pcKeys.right) {
        player.x += player.speed;
    }
    player.x = Math.max(0, Math.min(dom.gameCanvas.width - player.size, player.x));
    
    requestAnimationFrame(gameLoop);
    dom.gameCtx.clearRect(0, 0, dom.gameCanvas.width, dom.gameCanvas.height);
    drawPlayer();
    updateAttacks();
    updateEnemies();
};

// 开始游戏时显示操作提示
dom.startBtn.addEventListener('click', function() {
    setTimeout(function() {
        var tip = document.createElement('div');
        tip.style.cssText = 'position:absolute;bottom:15px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:13px;text-align:center;z-index:8;pointer-events:none;';
        tip.innerHTML = 'A/D 或 ←/→ 移动 | 空格/鼠标左键 射击 | 1/2 物品 | E 交互 | ESC 退出';
        document.body.appendChild(tip);
    }, 100);
});

// 把触摸启动音乐改成点击启动
document.body.addEventListener('click', function(){
    config.sound.mainBgm.play();
},{once: true});
// ========== PC 优化结束 ==========

window.addEventListener('load',()=>{
initData();
resizeCanvas();
setTimeout(()=>{
config.sound.mainBgm.play().catch(()=>{});
},500);
});

document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('copy',e=>e.preventDefault());
document.addEventListener('cut',e=>e.preventDefault());
document.addEventListener('paste',e=>e.preventDefault());
</script>
